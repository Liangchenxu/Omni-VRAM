name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest 自 2026-10-19 起指向 Ubuntu 26.04，而 Python 3.9 在
        # actions/python-versions 中只有 22.04 / 24.04 的构建产物，
        # 钉死 ubuntu-24.04 才能让 3.9 / 3.10 / 3.11 三个版本同时可用。
        os: [ubuntu-24.04, windows-latest]
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install System Audio Dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update -y
        sudo apt-get install -y libsndfile1 ffmpeg portaudio19-dev

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 优先安装 CPU 版 PyTorch，避免云端下载 2GB 的 GPU 驱动轮子
        pip install torch --index-url https://download.pytorch.org/whl/cpu || true
        pip install -e ".[dev]" || pip install -e .
        pip install pytest

    - name: Run tests (CPU & Runtime Fallback)
      env:
        CUDA_VISIBLE_DEVICES: ""
        OMNI_VRAM_DEVICE: "cpu"
      run: |
        pytest tests/ -v --tb=short
      continue-on-error: true

    - name: Run integration test
      env:
        CUDA_VISIBLE_DEVICES: ""
        OMNI_VRAM_DEVICE: "cpu"
      run: |
        python test_run.py
      continue-on-error: true

  lint:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install black isort flake8

    - name: Check code quality
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
